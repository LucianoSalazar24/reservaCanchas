server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida vuelve a index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca en caché: si no, el navegador sigue cargando bundles viejos tras un deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA: service worker y manifest siempre frescos (si no, los usuarios quedan con una versión vieja)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Cache largo para assets con hash en el nombre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
