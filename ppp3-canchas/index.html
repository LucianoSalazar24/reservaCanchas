<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- viewport-fit=cover: habilita env(safe-area-inset-*) (notch / barra inferior).
         interactive-widget=resizes-content: en Android el teclado achica el alto disponible
         (el chat a pantalla completa queda por encima del teclado). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>ReservaCanchas – Reservá tu Cancha de Fútbol</title>
    <meta name="description" content="Encontrá y reservá canchas de fútbol cerca tuyo." />

    <!-- PWA: instalable en el celular como una app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS no usa el manifest para esto: necesita sus propias etiquetas -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FutbolReservas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
