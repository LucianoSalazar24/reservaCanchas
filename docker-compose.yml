services:
  postgres:
    image: postgres:16-alpine
    container_name: canchas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: canchas_user
      POSTGRES_PASSWORD: canchas_pass
      POSTGRES_DB: canchas_db
    ports:
      - "5432:5432"
    volumes:
      - canchas_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - canchas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canchas_user -d canchas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-usuarios:
    build: ./api-usuarios
    container_name: canchas_api_usuarios
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      NODE_ENV: development
      TURNOS_URL: http://api-turnos:3003
    ports:
      - "3001:3001"
    networks:
      - canchas_net
    depends_on:
      postgres:
        condition: service_healthy

  api-canchas:
    build: ./api-canchas
    container_name: canchas_api_canchas
    restart: unless-stopped
    environment:
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      NODE_ENV: development
      # Disponibilidad para el chatbot y verificación de reservas activas (dueño: api-turnos).
      TURNOS_URL: http://api-turnos:3003
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      # Límite por paso del chatbot (ms). Gemini puede tardar varios segundos según modelo/región.
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-45000}
    ports:
      - "3002:3002"
    networks:
      - canchas_net
    depends_on:
      postgres:
        condition: service_healthy

  api-turnos:
    build: ./api-turnos
    container_name: canchas_api_turnos
    restart: unless-stopped
    environment:
      PORT: 3003
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      NODE_ENV: development
      USUARIOS_URL: http://api-usuarios:3001
      CANCHAS_URL: http://api-canchas:3002
      # Avisos por mail al reservar/confirmar/cancelar (fire-and-forget: si está caído, la reserva igual se crea).
      NOTIFICACIONES_URL: http://api-notificaciones:3005
      SENA_PORCENTAJE_DEFAULT: 30
      HORAS_ANTICIPACION_MIN: 2
      DURACION_MAXIMA_HORAS: 3
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
    ports:
      - "3003:3003"
    networks:
      - canchas_net
    depends_on:
      postgres:
        condition: service_healthy
      api-usuarios:
        condition: service_started
      api-canchas:
        condition: service_started

  api-pagos:
    build: ./api-pagos
    container_name: canchas_api_pagos
    restart: unless-stopped
    environment:
      PORT: 3004
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      NODE_ENV: development
      TURNOS_URL: http://api-turnos:3003
    ports:
      - "3004:3004"
    networks:
      - canchas_net
    depends_on:
      postgres:
        condition: service_healthy
      api-turnos:
        condition: service_started

  # Manda los mails (SMTP gratuito). Sin base de datos y sin ruta en el gateway: solo lo llama api-turnos.
  api-notificaciones:
    build: ./api-notificaciones
    container_name: canchas_api_notificaciones
    restart: unless-stopped
    environment:
      PORT: 3005
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      NODE_ENV: development
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3005:3005"
    networks:
      - canchas_net

  # Bandeja de mails de PRUEBA (solo desarrollo): `docker compose --profile dev up -d mailpit`
  # y SMTP_HOST=mailpit SMTP_PORT=1025 en el .env. Los mails se ven en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: canchas_mailpit
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - canchas_net

  gateway:
    build: ./gateway
    container_name: canchas_gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      NODE_ENV: development
      USUARIOS_URL: http://api-usuarios:3001
      CANCHAS_URL: http://api-canchas:3002
      TURNOS_URL: http://api-turnos:3003
      PAGOS_URL: http://api-pagos:3004
    ports:
      - "3000:3000"
    networks:
      - canchas_net
    depends_on:
      - api-usuarios
      - api-canchas
      - api-turnos
      - api-pagos

  frontend:
    build:
      context: ./ppp3-canchas
      args:
        # URL del gateway embebida en el bundle (el navegador la consume vía CORS)
        # (sale del .env de cada máquina: en el VPS, VITE_API_URL=http://<ip-o-dominio>:3000)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: canchas_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - canchas_net
    depends_on:
      - gateway

networks:
  canchas_net:
    driver: bridge

volumes:
  canchas_pgdata:
