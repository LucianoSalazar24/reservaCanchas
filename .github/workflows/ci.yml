name: CI

# Chequeo automático: que cada servicio y el frontend compilen y que el compose sea válido.
# NO despliega nada ni toca el VPS (eso va en un workflow aparte).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Si llega un push nuevo a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # que un servicio roto no oculte el estado de los demás
      matrix:
        service: [gateway, api-usuarios, api-canchas, api-turnos, api-pagos, api-notificaciones]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      # `npm ci` instala exactamente lo del package-lock.json (igual que el Dockerfile).
      - run: npm ci
      # `nest build` falla ante cualquier error de TypeScript.
      - run: npm run build

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ppp3-canchas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ppp3-canchas/package-lock.json
      - run: npm ci
      # El lint ya tiene errores previos en archivos viejos (Paso3Resumen, useFetch, etc.):
      # se informa pero no bloquea. Cuando se limpien, sacar `continue-on-error`.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true
      # `tsc -b && vite build`: falla por errores de tipos o de bundling.
      - run: npm run build

  compose:
    name: Validar docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El compose interpola variables del .env; la plantilla alcanza para validar la sintaxis.
      - run: cp .env.template .env
      - name: docker compose config
        run: docker compose config --quiet
      - name: docker compose config (perfil dev, incluye mailpit)
        run: docker compose --profile dev config --quiet
